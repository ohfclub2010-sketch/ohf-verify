<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Heart Friends Club - সদস্যপদ যাচাই</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0b1f3a 0%, #102a4d 50%, #0d3b66 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #1e293b;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .header {
      background: linear-gradient(135deg, #0d3b66 0%, #0284c7 100%);
      padding: 24px 20px;
      text-align: center;
      color: #ffffff;
      position: relative;
    }
    .logo-badge {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      border: 2px solid #38bdf8;
    }
    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .club-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .club-subtitle {
      font-size: 13px;
      color: #bae6fd;
      margin-top: 4px;
      font-weight: 500;
    }
    .content {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .status-banner {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .status-approved {
      background: #ecfdf5;
      color: #047857;
      border: 1.5px solid #10b981;
    }
    .status-invalid {
      background: #fef2f2;
      color: #b91c1c;
      border: 1.5px solid #ef4444;
    }
    .status-notfound {
      background: #fffbeb;
      color: #b45309;
      border: 1.5px solid #f59e0b;
    }
    .status-loading {
      background: #f1f5f9;
      color: #475569;
      border: 1.5px solid #cbd5e1;
    }
    .avatar-wrapper {
      position: relative;
      margin-bottom: 14px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #10b981;
      background: #e2e8f0;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }
    .avatar.invalid {
      border-color: #ef4444;
    }
    .avatar-initial {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7 0%, #0d3b66 100%);
      color: #ffffff;
      font-size: 38px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #10b981;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }
    .avatar-initial.invalid {
      border-color: #ef4444;
      background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
    }
    .member-name {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .designation-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .info-card {
      width: 100%;
      background: #f8fafc;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      margin-bottom: 18px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #cbd5e1;
    }
    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .info-label {
      color: #64748b;
      font-weight: 500;
    }
    .info-value {
      font-weight: 700;
      color: #0f172a;
    }
    .blood-badge {
      background: #fee2e2;
      color: #dc2626;
      padding: 2px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
    }
    .verified-time {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .privacy-notice {
      margin-top: 14px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #0284c7;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .footer {
      background: #f1f5f9;
      padding: 14px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>

  <script>
    // Firebase Configuration for OHF Club
    const firebaseConfig = {
      apiKey: "AIzaSyAGbyDUftOk77ZrddfYJOni3Xdasicrogs",

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Helper: Bangla digits & date formatting
    const banglaDigits = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
    function toBanglaNumber(str) {
      if (!str) return '';
      return String(str).replace(/[0-9]/g, function(w){ return banglaDigits[w] || w; });
    }

    function formatBengaliDate(timestamp) {
      if (!timestamp) return 'অজানা';
      const date = new Date(timestamp);
      const months = [
        "জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন",
        "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"
      ];
      const day = toBanglaNumber(date.getDate());
      const month = months[date.getMonth()];
      const year = toBanglaNumber(date.getFullYear());
      return `${day} ${month}, ${year}`;
    }

    function getCurrentBengaliDateTime() {
      const date = new Date();
      const months = [
        "জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন",
        "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"
      ];
      const day = toBanglaNumber(date.getDate());
      const month = months[date.getMonth()];
      const year = toBanglaNumber(date.getFullYear());
      let hours = date.getHours();
      const ampm = hours >= 12 ? 'অপরাহ্ন' : 'পূর্বাহ্ন';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${day} ${month}, ${year} | ${ampm} ${toBanglaNumber(hours)}:${toBanglaNumber(minutes)}`;
    }

    // Extract query parameter ?id=... or ?token=... or #id=...
    const urlParams = new URLSearchParams(window.location.search);
    let token = (urlParams.get('id') || urlParams.get('token') || '').trim();
    if (!token && window.location.hash) {
      const hash = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hash);
      token = (hashParams.get('id') || hashParams.get('token') || hash).trim();
    }
    try {
      token = decodeURIComponent(token);
    } catch (e) {}
    token = token.replace(/[\/\\]+$/, '').trim();

    const mainContent = document.getElementById('mainContent');

    function renderNotFound() {
      mainContent.innerHTML = `
        <div class="status-banner status-notfound">
          ⚠ কোনো সদস্য পাওয়া যায়নি
        </div>
        <p style="color: #b45309; font-size: 15px; font-weight: 600; margin-bottom: 8px;">
          এই কার্ডটি ভুয়া অথবা বাতিল হতে পারে
        </p>
        <p style="color: #64748b; font-size: 13px; margin-bottom: 16px;">
          প্রদত্ত কিউআর কোড বা যাচাই টোকেনের সাথে ডাটাবেজের কোনো অনুমোদিত রেকর্ডের মিল পাওয়া যায়নি।
        </p>
        <div class="verified-time">
          🕒 যাচাইয়ের সময়: ${getCurrentBengaliDateTime()}
        </div>
      `;
    }

    function renderMember(data) {
      const statusLower = (data.status || '').toLowerCase().trim();
      const isApproved = (statusLower === 'approved' || statusLower === 'সক্রিয়' || statusLower === 'অনুমোদিত');
      const bannerClass = isApproved ? 'status-approved' : 'status-invalid';
      const bannerText = isApproved ? '✓ যাচাইকৃত সদস্য' : '✗ এই সদস্যপদ বৈধ নয়';
      const statusTitle = isApproved ? 'অনুমোদিত ও সক্রিয়' : (statusLower === 'pending' || statusLower === 'অপেক্ষমান' ? 'অনুমোদনের অপেক্ষায়' : (statusLower === 'suspended' || statusLower === 'স্থগিতকৃত' ? 'স্থগিতকৃত' : 'বাতিলকৃত'));

      const avatarHtml = data.photoUrl ? `
        <img class="avatar ${isApproved ? '' : 'invalid'}" src="${data.photoUrl}" alt="${data.name}" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'avatar-initial ${isApproved ? '' : 'invalid'}\\'>${(data.name || 'স').charAt(0)}</div>';">
      ` : `
        <div class="avatar-initial ${isApproved ? '' : 'invalid'}">
          ${(data.name || 'স').charAt(0)}
        </div>
      `;

      mainContent.innerHTML = `
        <div class="status-banner ${bannerClass}">
          ${bannerText}
        </div>

        <div class="avatar-wrapper">
          ${avatarHtml}
        </div>

        <h2 class="member-name">${data.name || 'সদস্য'}</h2>
        <div class="designation-badge">${data.designation || data.position || 'সাধারণ সদস্য'}</div>

        <div class="info-card">
          <div class="info-row">
            <span class="info-label">সদস্য আইডি</span>
            <span class="info-value" style="font-family: monospace; letter-spacing: 0.5px; color: #0284c7;">
              ${data.memberId || 'N/A'}
            </span>
          </div>
          <div class="info-row">
            <span class="info-label">রক্তের গ্রুপ</span>
            <span class="info-value">
              <span class="blood-badge">${data.bloodGroup || 'অজানা'}</span>
            </span>
          </div>
          <div class="info-row">
            <span class="info-label">যোগদানের তারিখ</span>
            <span class="info-value">${formatBengaliDate(data.joinDate)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">বর্তমান অবস্থা</span>
            <span class="info-value" style="color: ${isApproved ? '#047857' : '#b91c1c'};">
              ${statusTitle}
            </span>
          </div>
        </div>

        <div class="verified-time">
          🕒 যাচাইয়ের সময়: ${getCurrentBengaliDateTime()}
        </div>

        <div class="privacy-notice">
          নিরাপত্তা ও গোপনীয়তা রক্ষার স্বার্থে ব্যক্তিগত মোবাইল নম্বর ও ঠিকানা সর্বসাধারণের জন্য অপ্রকাশিত রাখা হয়েছে।
        </div>
      `;
    }

    async function fetchRecordFromFirestore(docId) {
      if (!docId) return null;
      // 1. Try Firebase Web SDK (.doc)
      try {
        if (typeof db !== 'undefined' && db && db.collection) {
          const docRef = db.collection('publicVerify').doc(docId);
          const snap = await docRef.get();
          if (snap.exists) {
            return snap.data();
          }
        }
      } catch (e) {
        console.warn('Firebase SDK get failed, falling back to REST API:', e);
      }

      // 2. Direct Firestore REST API (Fast, reliable, zero SDK dependency)
      try {
        const url = `https://firestore.googleapis.com/v1/projects/ohf-club-2026/databases/(default)/documents/publicVerify/${encodeURIComponent(docId)}?key=AIzaSyAGbyDUftOk77ZrddfYJOni3Xdasicrogs`;
        const res = await fetch(url);
        if (res.ok) {
          const json = await res.json();
          if (json && json.fields) {
            return {
              name: json.fields.name?.stringValue || '',
              memberId: json.fields.memberId?.stringValue || '',
              designation: json.fields.designation?.stringValue || json.fields.position?.stringValue || '',
              position: json.fields.position?.stringValue || json.fields.designation?.stringValue || '',
              bloodGroup: json.fields.bloodGroup?.stringValue || '',
              photoUrl: json.fields.photoUrl?.stringValue || '',
              status: json.fields.status?.stringValue || '',
              joinDate: parseInt(json.fields.joinDate?.integerValue || '0', 10),
              token: json.fields.token?.stringValue || docId
            };
          }
        }
      } catch (err) {
        console.error('REST API fetch error:', err);
      }
      return null;
    }

    async function checkVerification() {
      if (!token) {
        renderNotFound();
        return;
      }

      try {
        // 1. Check direct token
        let data = await fetchRecordFromFirestore(token);
        if (data) {
          renderMember(data);
          return;
        }

        // 2. Check upper-cased token (e.g. OHF-2026-9157)
        const upper = token.toUpperCase();
        if (upper !== token) {
          data = await fetchRecordFromFirestore(upper);
          if (data) {
            renderMember(data);
            return;
          }
        }

        // 3. Fallback: Query by memberId
        try {
          if (typeof db !== 'undefined' && db && db.collection) {
            const queryByMemberId = await db.collection('publicVerify')
              .where('memberId', '==', token)
              .limit(1)
              .get();
            if (!queryByMemberId.empty) {
              renderMember(queryByMemberId.docs[0].data());
              return;
            }
            if (upper !== token) {
              const queryUpper = await db.collection('publicVerify')
                .where('memberId', '==', upper)
                .limit(1)
                .get();
              if (!queryUpper.empty) {
                renderMember(queryUpper.docs[0].data());
                return;
              }
            }
          }
        } catch (queryErr) {
          console.warn('Query by memberId failed:', queryErr);
        }

        renderNotFound();
      } catch (err) {
        console.error('Verification error:', err);
        renderNotFound();
      }
    }

    checkVerification();
  </script>
</body>
